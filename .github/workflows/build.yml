name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Keep in sync with release.yml
  XCODE_PATH: /Applications/Xcode_26.5.app

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      # ClaudeTracker.xcodeproj is generated from project.yml (XcodeGen) and not committed.
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      # Catches violations on PRs instead of at release time, where a strict lint
      # failure would kill the release pipeline mid-run.
      - name: Lint
        run: make lint

      # Release configuration on purpose: it uses wholemodule optimization, which can
      # surface errors (notably concurrency diagnostics on new Xcode versions) that a
      # Debug build misses — and Release is what `make tag` ships.
      - name: Build (Release)
        run: |
          xcodebuild \
            -project ClaudeTracker.xcodeproj \
            -scheme ClaudeTracker \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild test \
            -project ClaudeTracker.xcodeproj \
            -scheme ClaudeTrackerTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
