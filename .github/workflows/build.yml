name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      # ClaudeTracker.xcodeproj is generated from project.yml (XcodeGen) and not committed.
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build
        run: |
          xcodebuild \
            -project ClaudeTracker.xcodeproj \
            -scheme ClaudeTracker \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild test \
            -project ClaudeTracker.xcodeproj \
            -scheme ClaudeTrackerTests \
            -destination 'platform=macOS' \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGN_IDENTITY="-"
