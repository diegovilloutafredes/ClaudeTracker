# XcodeGen spec for ClaudeTracker.
#
# This is the source of truth for the Xcode project. The generated
# `ClaudeTracker.xcodeproj` is NOT committed — run `make generate` (or
# `xcodegen generate`) before opening it. Settings here are a verbatim
# transcription of the previous hand-written project.pbxproj; `settingPresets:
# none` keeps XcodeGen from injecting any extra Apple-template settings so the
# resolved build settings stay identical to the old project.
name: ClaudeTracker

options:
  settingPresets: none
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "1540"

# Project-level configurations (verbatim from the old project.pbxproj).
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    SDKROOT: macosx
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  ClaudeTracker:
    type: application
    platform: macOS
    sources:
      - path: ClaudeTracker
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ClaudeTracker/ClaudeTracker.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ClaudeTracker/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.19.5"
        PRODUCT_BUNDLE_IDENTIFIER: com.claudetracker.app
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  ClaudeTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeTrackerTests
    dependencies:
      - target: ClaudeTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.claudetracker.app.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClaudeTracker.app/Contents/MacOS/ClaudeTracker"

# Both schemes are declared so the existing Makefile invocations keep working
# unchanged: `-scheme ClaudeTracker` (build/run) and `-scheme ClaudeTrackerTests` (test).
schemes:
  ClaudeTracker:
    build:
      targets:
        ClaudeTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudeTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ClaudeTrackerTests:
    build:
      targets:
        ClaudeTrackerTests: all
    test:
      config: Debug
      targets:
        - ClaudeTrackerTests
